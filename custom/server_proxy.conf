# NPM includes this file into the server block of every proxy host.
# Install or update it with scripts/apply-custom.sh.

# NPM's http-level list also trusts the Cloudflare and CloudFront ranges it
# fetches, so a request relayed through either could choose its client
# address with X-Real-IP. A server-level list replaces the inherited one.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;

# Only the gatehouse SSO snippets may set these, from the authentik outpost;
# on a custom location without auth_request a client's own copy would reach
# the upstream.
more_clear_input_headers 'X-authentik-*';
